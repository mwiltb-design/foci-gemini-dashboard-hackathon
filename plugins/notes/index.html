<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Notes</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e9eef5; background: #141920; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: clamp(18px, 5vw, 48px); background: radial-gradient(circle at top right, #263d38, #141920 46%); }
    main { width: min(100%, 760px); margin: 0 auto; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .eyebrow { color: #69d3b2; font: 600 11px ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 7px 0 5px; font-size: clamp(27px, 6vw, 42px); }
    header p, .empty, .error { color: #9ba8b8; line-height: 1.5; }
    .pi-badge { flex: 0 0 auto; padding: 8px 10px; color: #78a9ff; background: #172538; border: 1px solid #2e4667; border-radius: 99px; font-size: 11px; }
    form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; padding: 12px; background: #1a2028; border: 1px solid #303945; border-radius: 12px; }
    input { min-width: 0; padding: 12px 13px; color: #e9eef5; background: #0d1116; border: 1px solid #303945; border-radius: 8px; font: inherit; }
    button { padding: 10px 14px; color: #10201d; background: #69d3b2; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    ul { display: grid; gap: 9px; padding: 0; margin: 18px 0 0; list-style: none; }
    li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 14px; background: #1a2028; border: 1px solid #303945; border-radius: 11px; }
    li p { margin: 0 0 7px; overflow-wrap: anywhere; line-height: 1.5; }
    time { color: #8290a1; font: 10px ui-monospace, monospace; }
    li button { align-self: center; padding: 7px 9px; color: #ef7d88; background: transparent; border: 1px solid #5c3038; font-size: 11px; }
    .empty, .error { padding: 34px 16px; text-align: center; }
    .error { color: #ef7d88; }
    @media (max-width: 520px) { header { flex-direction: column; } form { grid-template-columns: 1fr; } form button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><span class="eyebrow">Agent-connected plugin</span><h1>Shared Notes</h1><p>Use this list here, or separately allow Pi to read and change it from Chat.</p></div>
      <span class="pi-badge">Pi access optional</span>
    </header>
    <form id="note-form">
      <input id="note-text" maxlength="240" placeholder="Write a short note…" aria-label="New note" required>
      <button id="add-button" type="submit">Add note</button>
    </form>
    <div id="status" class="empty">Loading notes…</div>
    <ul id="notes" hidden></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
